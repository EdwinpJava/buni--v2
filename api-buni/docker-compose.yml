version: '3.8'

services:
  # Base de datos MySQL
  db:
    image: mysql:8.0
    container_name: buni-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - buni-network

  # Servidor Backend / App
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: buni-backend
    restart: always
    environment:
      PORT: 3000
      DB_HOST: db
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      JWT_SECRET: ${JWT_SECRET}
    depends_on:
      - db
    networks:
      - buni-network

networks:
  buni-network:
    driver: bridge

volumes:
  mysql_data:
